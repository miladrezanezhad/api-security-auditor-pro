version: '3.8'

services:
  api-auditor:
    build: .
    image: api-security-auditor-pro:latest
    volumes:
      - ./output:/output
      - ./examples:/examples
    environment:
      - API_AUDITOR_VERBOSE=${API_AUDITOR_VERBOSE:-false}
      - API_AUDITOR_THREADS=${API_AUDITOR_THREADS:-10}
    entrypoint: ["api-auditor"]
  
  # Test target API (vulnerable by design)
  test-api:
    image: vulnerables/web-dav
    ports:
      - "8080:80"
    environment:
      - WEBDAV_USERNAME=test
      - WEBDAV_PASSWORD=test
  
  # Vulnerable GraphQL API for testing
  graphql-test:
    image: hasura/graphql-engine:v2.36.0
    ports:
      - "8081:8080"
    environment:
      - HASURA_GRAPHQL_ENABLE_CONSOLE=true
      - HASURA_GRAPHQL_DEV_MODE=true
      - HASURA_GRAPHQL_UNAUTHORIZED_ROLE=anonymous
  
  # MongoDB for NoSQL injection testing
  mongodb-test:
    image: mongo:latest
    ports:
      - "27017:27017"
  
  # Rate limiting test endpoint
  rate-limit-test:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./tests/fixtures/nginx-rate-limit.conf:/etc/nginx/conf.d/default.conf

networks:
  default:
    driver: bridge